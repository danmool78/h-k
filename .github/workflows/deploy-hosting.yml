# 웹 페이지(server/public) + 앱 화면 웹판(shared → /app/) + Firestore 규칙 자동 배포
#  - main 에 병합되면 h-y-server.web.app 에 배포
#  - PR 이면 미리보기 주소에 배포하고 PR 에 댓글로 주소를 남김 (7일 뒤 만료)
# 함수(server/functions)는 자동 배포하지 않는다: 예약 수집 함수가 다시 살아나 비용이 생기므로 손으로 배포.
# 필요한 저장소 Secret: FIREBASE_SERVICE_ACCOUNT_H_Y_SERVER (Firebase 서비스 계정 키 JSON)
name: Deploy hosting

on:
  push:
    branches: [main]
    paths: ["server/public/**", "server/firebase.json", "server/firestore.rules", "shared/**", "gradle/**", "*.gradle.kts", ".github/workflows/deploy-hosting.yml"]
  pull_request:
    paths: ["server/public/**", "server/firebase.json", "server/firestore.rules", "shared/**", "gradle/**", "*.gradle.kts", ".github/workflows/deploy-hosting.yml"]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_H_Y_SERVER }}
    steps:
      - uses: actions/checkout@v4
      # 앱 화면 웹판: 차량 앱과 같은 코드(shared)를 wasm 으로 빌드해 /app/ 에 넣는다
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: 웹 앱 빌드
        run: |
          ./gradlew :shared:wasmJsBrowserDistribution
          mkdir -p server/public/app
          cp -r shared/build/dist/wasmJs/productionExecutable/. server/public/app/
          rm -f server/public/app/*.map
      - name: Secret 확인
        if: env.SA == ''
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT_H_Y_SERVER Secret 이 없어 배포를 건너뜁니다"
      # 다른 저장소에서 온 PR 은 Secret 을 받지 못하므로 건너뜀
      - name: 미리보기 배포 (PR)
        if: env.SA != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_H_Y_SERVER }}
          projectId: h-y-server
          entryPoint: server
          expires: 7d
      - name: 실서비스 배포 (main)
        if: env.SA != '' && github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_H_Y_SERVER }}
          projectId: h-y-server
          entryPoint: server
          channelId: live
      # 휴대폰 시연용 Firestore 규칙. 서비스 계정에 규칙 배포 권한(Firebase Rules Admin)이 없으면 실패하므로
      # 실패해도 웹 배포는 그대로 두고 경고만 남긴다 → 그때는 콘솔에 server/firestore.rules 를 붙여 넣는다
      - name: Firestore 규칙 배포 (main)
        if: env.SA != '' && github.event_name == 'push'
        continue-on-error: true
        working-directory: server
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@13 deploy --only firestore:rules --project h-y-server --non-interactive \
            || echo "::warning::Firestore 규칙 배포 실패 — Firebase 콘솔 → Firestore → 규칙에 server/firestore.rules 를 붙여 넣어 주세요"
          rm -f "$RUNNER_TEMP/sa.json"
