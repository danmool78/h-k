<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>주행 흔들림 녹화기</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#9aa3b5; --accent:#4f8cff; --good:#4caf50; --warn:#ffb300; --bad:#e53935; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size:20px; margin:4px 0 2px; } .muted { color:var(--muted); } .small { font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:12px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 6px; }
  .seg { display:flex; flex-wrap:wrap; gap:6px; }
  .seg button { flex:1 1 auto; min-width:64px; padding:10px 8px; border-radius:10px; border:1px solid var(--line); background:#11141a; color:var(--text); font-size:14px; }
  .seg button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .big { width:100%; padding:18px; border:0; border-radius:14px; font-size:18px; font-weight:700; color:#fff; background:var(--accent); margin-top:12px; }
  .big.stop { background:var(--bad); }
  .big:disabled { opacity:.4; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .sick { padding:22px 8px; border:0; border-radius:14px; font-size:17px; font-weight:700; color:#000; }
  .sick.s1 { background:var(--warn); } .sick.s2 { background:#ff7043; } .sick.ok { background:var(--good); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
  .stats b { display:block; font-size:22px; } .stats span { font-size:12px; color:var(--muted); }
  .meter { height:14px; background:#11141a; border-radius:7px; overflow:hidden; margin-top:6px; }
  .meter div { height:100%; width:0; background:var(--good); transition:width .1s; }
  .log { font-size:13px; max-height:140px; overflow:auto; margin-top:8px; }
  .log div { padding:4px 0; border-bottom:1px solid var(--line); }
  .warn { color:var(--warn); } .bad { color:var(--bad); }
  .hide { display:none !important; }
  .sess { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .sess button { padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#11141a; color:var(--text); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>주행 흔들림 녹화기</h1>
  <div class="muted small">차에 동승자로 타서 휴대폰 센서(가속도·회전·GPS)로 흔들림을 기록합니다. 기록은 이 휴대폰에만 저장되고, 끝나면 파일로 내려받습니다.</div>

  <section class="card" id="setup">
    <label>탈 것</label>
    <div class="seg" data-key="vehicle"><button>승용차</button><button>택시</button><button>버스</button><button>기타</button></div>
    <label>앉은 자리</label>
    <div class="seg" data-key="seat"><button>조수석</button><button>뒷좌석</button><button>운전석</button><button>버스 앞쪽</button><button>버스 뒤쪽</button></div>
    <label>휴대폰 둔 곳 (손에 들면 손 떨림이 섞입니다)</label>
    <div class="seg" data-key="placement"><button>거치대</button><button>컵홀더</button><button>무릎·가방 위</button><button>손에 듦</button></div>
    <label>평소 멀미</label>
    <div class="seg" data-key="susceptibility"><button>거의 안 함</button><button>가끔</button><button>자주</button></div>
    <button class="big" id="start">녹화 시작</button>
    <div class="muted small" style="margin-top:8px">녹화 중에는 화면이 켜져 있어야 합니다 (다른 앱으로 가면 기록이 멈춥니다). 배터리가 빨리 닳으니 충전기를 연결하면 좋습니다.</div>
  </section>

  <section class="card hide" id="live">
    <div class="stats">
      <div><b id="elapsed">0:00</b><span>경과</span></div>
      <div><b id="speed">–</b><span>속도 km/h</span></div>
      <div><b id="hz">–</b><span>센서 Hz</span></div>
    </div>
    <label>지금 흔들림 (수평 가속도)</label>
    <div class="meter"><div id="shake"></div></div>
    <div class="muted small" id="shakeText" style="margin-top:4px">–</div>

    <label>지금 몸 상태 (느낄 때마다 눌러 주세요)</label>
    <div class="row">
      <button class="sick ok" data-mark="ok">괜찮아요</button>
      <button class="sick s1" data-mark="sick1">조금 울렁</button>
      <button class="sick s2" data-mark="sick2">많이 울렁</button>
    </div>
    <button class="big stop" id="stop">녹화 끝내기</button>
    <div class="log" id="log"></div>
  </section>

  <section class="card" id="saved">
    <b>저장된 기록</b>
    <div id="sessions" class="muted small" style="margin-top:6px">불러오는 중…</div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const meta = { vehicle: null, seat: null, placement: null, susceptibility: null };

// ---- 선택 버튼 ----
for (const seg of document.querySelectorAll(".seg")) {
  seg.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    for (const x of seg.children) x.classList.toggle("on", x === b);
    meta[seg.dataset.key] = b.textContent;
  });
}

// ---- IndexedDB: 10초마다 조각(chunk)으로 저장 → 새로고침·종료돼도 남음 ----
let dbp = null;
function db() {
  return dbp ??= new Promise((ok, fail) => {
    const r = indexedDB.open("rec", 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore("sessions", { keyPath: "id" });
      r.result.createObjectStore("chunks", { autoIncrement: true }).createIndex("session", "session");
    };
    r.onsuccess = () => ok(r.result); r.onerror = () => fail(r.error);
  });
}
async function tx(store, mode, fn) {
  const d = await db();
  return new Promise((ok, fail) => {
    const t = d.transaction(store, mode); const res = fn(t.objectStore(store));
    t.oncomplete = () => ok(res?.result ?? res); t.onerror = () => fail(t.error);
  });
}
const putSession = (s) => tx("sessions", "readwrite", (st) => st.put(s));
const putChunk = (c) => tx("chunks", "readwrite", (st) => st.add(c));
const allSessions = () => tx("sessions", "readonly", (st) => st.getAll());
function chunksOf(id) {
  return db().then((d) => new Promise((ok, fail) => {
    const out = []; const r = d.transaction("chunks").objectStore("chunks").index("session").openCursor(IDBKeyRange.only(id));
    r.onsuccess = () => { const c = r.result; if (c) { out.push(c.value); c.continue(); } else ok(out); };
    r.onerror = () => fail(r.error);
  }));
}
async function deleteSession(id) {
  const d = await db();
  await new Promise((ok, fail) => {
    const t = d.transaction(["sessions", "chunks"], "readwrite");
    t.objectStore("sessions").delete(id);
    const r = t.objectStore("chunks").index("session").openCursor(IDBKeyRange.only(id));
    r.onsuccess = () => { const c = r.result; if (c) { c.delete(); c.continue(); } };
    t.oncomplete = ok; t.onerror = () => fail(t.error);
  });
}

// ---- 녹화 ----
const MOTION_KEYS = ["t", "ax", "ay", "az", "gx", "gy", "gz", "ra", "rb", "rg"];
let rec = null; // { id, t0, perf0, motion, gps, marks, events, seq }
const r3 = (x) => (x == null || !Number.isFinite(x) ? null : Math.round(x * 1000) / 1000);
const newMotion = () => Object.fromEntries(MOTION_KEYS.map((k) => [k, []]));

let grav = null, lastMotionT = 0, hzCount = 0, hzT = 0, peak = 0;
function onMotion(e) {
  if (!rec) return;
  const t = Math.round((performance.now() - rec.perf0) * 10) / 10;
  const a = e.acceleration, g = e.accelerationIncludingGravity, rr = e.rotationRate;
  const m = rec.motion;
  m.t.push(t);
  m.ax.push(r3(a?.x)); m.ay.push(r3(a?.y)); m.az.push(r3(a?.z));
  m.gx.push(r3(g?.x)); m.gy.push(r3(g?.y)); m.gz.push(r3(g?.z));
  m.ra.push(r3(rr?.alpha)); m.rb.push(r3(rr?.beta)); m.rg.push(r3(rr?.gamma));
  hzCount++;
  // 화면 표시용 수평 흔들림: 중력 방향(느린 평균)에 수직인 성분
  if (g?.x != null) {
    const v = [g.x, g.y, g.z];
    grav = grav ? grav.map((x, i) => x + (v[i] - x) * 0.02) : v;
    const gn = Math.hypot(...grav) || 9.8, u = grav.map((x) => x / gn);
    const lin = a?.x != null ? [a.x, a.y, a.z] : v.map((x, i) => x - grav[i]);
    const dot = lin[0] * u[0] + lin[1] * u[1] + lin[2] * u[2];
    const h = Math.hypot(lin[0] - dot * u[0], lin[1] - dot * u[1], lin[2] - dot * u[2]) / 9.81;
    peak = Math.max(peak * 0.995, h);
    if (t - lastMotionT > 100) { lastMotionT = t; showShake(h); }
  }
}
function showShake(h) {
  const pct = Math.min(h / 0.4, 1) * 100;
  $("shake").style.width = pct + "%";
  $("shake").style.background = h > 0.25 ? "var(--bad)" : h > 0.12 ? "var(--warn)" : "var(--good)";
  $("shakeText").textContent = `${h.toFixed(2)}g · 최근 최대 ${peak.toFixed(2)}g`;
}

let geoId = null;
function onGps(p) {
  if (!rec) return;
  const c = p.coords;
  rec.gps.push({ t: Math.round(performance.now() - rec.perf0), at: p.timestamp, lat: c.latitude, lng: c.longitude, acc: r3(c.accuracy), speed: r3(c.speed), heading: r3(c.heading), alt: r3(c.altitude) });
  $("speed").textContent = c.speed != null ? Math.round(c.speed * 3.6) : "–";
}
function onGpsErr(err) { log(`GPS 오류: ${err.message}`, "warn"); }

function log(text, cls = "") {
  const d = document.createElement("div");
  d.className = cls; d.textContent = `${clock()} ${text}`;
  $("log").prepend(d);
}
const clock = () => { const s = rec ? Math.floor((performance.now() - rec.perf0) / 1000) : 0; return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

function event(kind, extra = {}) {
  if (!rec) return;
  rec.events.push({ t: Math.round(performance.now() - rec.perf0), at: Date.now(), kind, ...extra });
}

async function flush(final = false) {
  if (!rec) return;
  const { motion, gps, events } = rec;
  if (motion.t.length || gps.length || events.length) {
    rec.motion = newMotion(); rec.gps = []; rec.events = [];
    await putChunk({ session: rec.id, seq: rec.seq++, motion, gps, events });
  }
  await putSession({ ...rec.session, endedAt: final ? Date.now() : null, savedAt: Date.now(), chunks: rec.seq });
}

let wakeLock = null;
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) { log("화면 켜짐 유지 실패 — 화면 자동 꺼짐을 잠시 꺼 주세요", "warn"); }
}
document.addEventListener("visibilitychange", () => {
  if (!rec) return;
  if (document.visibilityState === "hidden") { event("hidden"); flush(); }
  else { event("visible"); log("화면이 꺼졌거나 다른 앱에 갔던 동안은 기록이 없습니다", "warn"); keepAwake(); }
});

let timer = null;
$("start").onclick = async () => {
  // 아이폰: 사용자 동작 안에서 센서 허용을 요청해야 한다
  try {
    if (typeof DeviceMotionEvent?.requestPermission === "function") {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== "granted") { alert("동작 센서 접근을 허용해야 녹화할 수 있습니다."); return; }
    }
  } catch (e) { alert("동작 센서 접근 요청 실패: " + e.message); return; }
  if (!("DeviceMotionEvent" in window)) { alert("이 브라우저는 동작 센서를 지원하지 않습니다."); return; }

  const now = Date.now(), id = new Date(now + 9 * 3600_000).toISOString().slice(0, 16).replace(/[-:]/g, "").replace("T", "-");
  const session = { id, startedAt: now, meta: { ...meta }, userAgent: navigator.userAgent, screen: `${screen.width}x${screen.height}`, format: 1, motionKeys: MOTION_KEYS };
  rec = { id, session, perf0: performance.now(), motion: newMotion(), gps: [], events: [], seq: 0 };
  grav = null; peak = 0; hzCount = 0; hzT = performance.now();
  await putSession(session);

  window.addEventListener("devicemotion", onMotion);
  if ("geolocation" in navigator) geoId = navigator.geolocation.watchPosition(onGps, onGpsErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  else log("GPS를 쓸 수 없습니다", "warn");
  await keepAwake();

  $("setup").classList.add("hide"); $("live").classList.remove("hide"); $("log").innerHTML = "";
  log("녹화 시작");
  event("start");
  let n = 0;
  timer = setInterval(() => {
    $("elapsed").textContent = clock();
    const dt = (performance.now() - hzT) / 1000;
    $("hz").textContent = Math.round(hzCount / dt); hzCount = 0; hzT = performance.now();
    if (++n % 10 === 0) flush().catch((e) => log("저장 실패: " + e.message, "bad"));
  }, 1000);
  setTimeout(() => { if (rec && !rec.motion.t.length && rec.seq === 0) log("센서 값이 들어오지 않습니다 — 브라우저 설정에서 동작 센서를 허용해 주세요", "bad"); }, 3000);
};

for (const b of document.querySelectorAll("[data-mark]")) {
  b.onclick = () => {
    event("feel", { level: b.dataset.mark });
    navigator.vibrate?.(40);
    log(`몸 상태: ${b.textContent}`, b.dataset.mark === "ok" ? "" : "warn");
  };
}

$("stop").onclick = async () => {
  if (!rec || !confirm("녹화를 끝낼까요?")) return;
  event("stop");
  window.removeEventListener("devicemotion", onMotion);
  if (geoId != null) navigator.geolocation.clearWatch(geoId);
  clearInterval(timer);
  await flush(true);
  try { await wakeLock?.release(); } catch {}
  const id = rec.id; rec = null;
  $("live").classList.add("hide"); $("setup").classList.remove("hide");
  await listSessions();
  exportSession(id);
};

// ---- 내보내기: 조각을 합쳐 한 파일 (gzip 지원 시 압축) ----
async function buildFile(id) {
  const s = (await allSessions()).find((x) => x.id === id);
  const chunks = (await chunksOf(id)).sort((a, b) => a.seq - b.seq);
  const motion = newMotion(), gps = [], events = [];
  for (const c of chunks) {
    for (const k of MOTION_KEYS) motion[k].push(...c.motion[k]);
    gps.push(...c.gps); events.push(...c.events);
  }
  const json = JSON.stringify({ ...s, motion, gps, events });
  const name = `rec-${id}`;
  if ("CompressionStream" in window) {
    const blob = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"))).blob();
    return new File([blob], name + ".json.gz", { type: "application/gzip" });
  }
  return new File([json], name + ".json", { type: "application/json" });
}
async function exportSession(id) {
  const f = await buildFile(id);
  // 휴대폰에서는 공유(카카오톡·메일 등)로 바로 PC에 보낼 수 있다
  if (navigator.canShare?.({ files: [f] })) {
    try { await navigator.share({ files: [f], title: f.name }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(f); a.download = f.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10_000);
}

async function listSessions() {
  const list = (await allSessions()).sort((a, b) => b.startedAt - a.startedAt);
  const el = $("sessions");
  if (!list.length) { el.textContent = "아직 기록이 없습니다"; return; }
  el.innerHTML = "";
  for (const s of list) {
    const end = s.endedAt ?? s.savedAt ?? s.startedAt, min = Math.round((end - s.startedAt) / 60000);
    const row = document.createElement("div"); row.className = "sess";
    const when = new Date(s.startedAt).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    row.innerHTML = `<div><b>${when}</b> · ${min}분<br><span class="muted">${[s.meta?.vehicle, s.meta?.seat, s.meta?.placement].filter(Boolean).join(" · ") || "정보 없음"}${s.endedAt ? "" : " · <span class='warn'>중간 저장본</span>"}</span></div>`;
    const btns = document.createElement("div"); btns.style.display = "flex"; btns.style.gap = "6px";
    const ex = document.createElement("button"); ex.textContent = "내보내기"; ex.onclick = () => exportSession(s.id);
    const del = document.createElement("button"); del.textContent = "삭제"; del.onclick = async () => { if (confirm("이 기록을 지울까요? 내보내지 않았다면 되돌릴 수 없습니다.")) { await deleteSession(s.id); listSessions(); } };
    btns.append(ex, del); row.append(btns); el.append(row);
  }
}
listSessions().catch((e) => { $("sessions").textContent = "저장소를 열 수 없습니다: " + e.message; });
</script>
</body>
</html>
