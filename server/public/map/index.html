<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안기다려 실시간 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#9aa3b5; --good:#4caf50; --warn:#ffb300; --bad:#e53935; --accent:#4f8cff; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif; }
  #map { position:fixed; inset:0; }
  .panel { position:fixed; z-index:1000; top:16px; left:16px; right:16px; max-width:460px; background:rgba(24,27,34,.94); border:1px solid var(--line); border-radius:16px; padding:16px 18px; backdrop-filter:blur(6px); }
  h1 { font-size:18px; margin:0 0 4px; } .muted { color:var(--muted); } .small { font-size:12px; }
  .big { display:flex; gap:18px; margin:12px 0 8px; flex-wrap:wrap; }
  .big div b { display:block; font-size:30px; line-height:1.1; }
  .bar { height:10px; border-radius:5px; background:#11141a; overflow:hidden; display:flex; margin:8px 0 4px; }
  .legend { display:flex; gap:12px; font-size:12px; color:var(--muted); flex-wrap:wrap; margin-top:8px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
  .seg { display:flex; gap:6px; margin-top:10px; }
  .seg button { flex:1; padding:6px; border-radius:8px; border:1px solid var(--line); background:#11141a; color:var(--text); cursor:pointer; font-size:12px; }
  .seg button.on { background:var(--accent); border-color:var(--accent); }
  .pulse { animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { opacity:1 } 50% { opacity:.45 } 100% { opacity:1 } }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:#181b22; color:var(--text); }
  .leaflet-popup-content b { font-size:14px; }
  a.link { color:var(--accent); }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>전국 고속도로 휴게소 충전 현황 <span class="pulse" style="color:var(--bad)">●</span> <span class="muted small">실시간</span></h1>
  <div class="muted small" id="updated">불러오는 중…</div>
  <div class="big">
    <div><span class="muted small">만차 휴게소</span><b id="full" style="color:var(--bad)">–</b></div>
    <div><span class="muted small">빈 충전기</span><b id="avail" style="color:var(--good)">–</b></div>
    <div><span class="muted small">휴게소</span><b id="total">–</b></div>
  </div>
  <div class="bar" id="bar"></div>
  <div class="legend">
    <span><span class="dot" style="background:var(--good)"></span>여유 (절반 이상 빔)</span>
    <span><span class="dot" style="background:var(--warn)"></span>혼잡</span>
    <span><span class="dot" style="background:var(--bad)"></span>만차</span>
    <span><span class="dot" style="background:#555"></span>운영 안 함</span>
  </div>
  <div class="seg" id="filter">
    <button data-v="all" class="on">전체</button><button data-v="full">만차만</button><button data-v="free">빈 곳만</button>
  </div>
  <div class="muted small" style="margin-top:10px">한국환경공단 실시간 데이터를 5분마다 수집 · <a class="link" href="../demo/">경로 추천 데모</a> · <a class="link" href="../replay/">실데이터 재현</a></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = "https://asia-northeast3-h-y-server.cloudfunctions.net/api";
const map = L.map("map", { zoomControl: false }).setView([36.3, 127.8], 7);
L.control.zoom({ position: "bottomright" }).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  maxZoom: 18, attribution: "© OpenStreetMap contributors © CARTO",
}).addTo(map);
const layer = L.layerGroup().addTo(map);
let data = null, filter = "all";

function color(r) {
  const inService = r.total - r.outOfService;
  if (inService <= 0) return "#555";
  if (r.available === 0) return "#e53935";
  return r.available / inService >= 0.5 ? "#4caf50" : "#ffb300";
}

function draw() {
  if (!data) return;
  layer.clearLayers();
  for (const r of data.stations) {
    const inService = r.total - r.outOfService;
    if (filter === "full" && !(inService > 0 && r.available === 0)) continue;
    if (filter === "free" && !(r.available > 0)) continue;
    const c = color(r);
    const radius = 4 + Math.min(inService, 10) * 0.8;
    const wait = r.available > 0 ? "대기 없음" : r.waitMin != null ? `예상 대기 약 ${Math.round(r.waitMin)}분` : "대기 판단 불가";
    const fc = r.forecast ? `<br><span style="color:#9aa3b5">이 시간대 평소 사용률 ${Math.round(r.forecast.busyRatio * 100)}%</span>` : "";
    L.circleMarker([r.lat, r.lng], { radius, color: c, weight: 1, fillColor: c, fillOpacity: r.available === 0 && inService > 0 ? 0.95 : 0.7 })
      .bindPopup(`<b>${r.name}</b><br>빈 충전기 ${r.available}/${inService} · 최대 ${Math.round(r.maxKw)}kW<br>${wait}${fc}`)
      .addTo(layer);
  }
}

async function load() {
  try {
    const r = await fetch(`${API}/restareas`);
    data = await r.json();
    const s = data.summary;
    document.getElementById("full").textContent = `${s.full}곳`;
    document.getElementById("avail").textContent = `${s.availableChargers.toLocaleString()} / ${s.chargers.toLocaleString()}`;
    document.getElementById("total").textContent = `${s.inService}곳`;
    const busy = s.chargers - s.availableChargers;
    document.getElementById("bar").innerHTML =
      `<div style="width:${s.availableChargers / s.chargers * 100}%;background:#4caf50"></div><div style="width:${busy / s.chargers * 100}%;background:#e53935"></div>`;
    document.getElementById("updated").textContent =
      `${new Date(data.at).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false })} 기준 · 1분마다 자동 갱신`;
    draw();
  } catch (e) {
    document.getElementById("updated").textContent = "불러오지 못했습니다: " + e.message;
  }
}

document.getElementById("filter").onclick = (e) => {
  const v = e.target.dataset?.v; if (!v) return;
  filter = v;
  document.querySelectorAll("#filter button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  draw();
};

load();
setInterval(load, 60_000);
</script>
</body>
</html>
