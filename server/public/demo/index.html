<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안기다려 데모</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#9aa3b5; --accent:#4f8cff; --good:#4caf50; --warn:#ffb300; --bad:#e53935; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif; }
  main { max-width:1280px; margin:0 auto; padding:20px 16px 40px; }
  header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:16px; }
  h1 { font-size:22px; margin:0; } .muted { color:var(--muted); } .small { font-size:13px; }
  .eta { text-align:right; } .eta b { font-size:30px; }
  .grid { display:grid; grid-template-columns: 340px 1fr; gap:16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  label span { float:right; color:var(--text); }
  select, input[type=range] { width:100%; }
  select { background:#11141a; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button { flex:1; padding:7px 8px; border-radius:8px; border:1px solid var(--line); background:#11141a; color:var(--text); cursor:pointer; font-size:13px; }
  .seg button.on { background:var(--accent); border-color:var(--accent); }
  .rec .name { font-size:28px; font-weight:700; margin:4px 0 10px; }
  .rec .wait b { font-size:44px; }
  .badge { display:inline-block; padding:8px 14px; border-radius:10px; font-weight:600; margin:14px 0 10px; }
  #map { height:320px; border-radius:12px; margin-top:16px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:8px 6px; border-bottom:1px solid var(--line); text-align:right; } th:first-child, td:first-child { text-align:left; }
  .tag { font-size:11px; padding:2px 6px; border-radius:6px; margin-left:6px; font-weight:700; }
  .loading { opacity:.5; pointer-events:none; }
  .err { color:var(--bad); }
  .right { display:flex; flex-direction:column; gap:16px; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>안기다려 <span class="muted small">웹 데모</span></h1>
      <div id="subtitle" class="muted small">기다리지 않는 충전 경로 · 충전소 실시간 데이터와 날씨 예보는 실제 값</div>
    </div>
    <div class="eta" id="eta"></div>
  </header>

  <div class="grid">
    <section class="card" id="controls">
      <label>목적지 (서울시청 출발)</label>
      <select id="dest"></select>

      <label>출발 <span id="departV"></span></label>
      <input id="depart" type="range" min="0" max="36" step="1" value="0">

      <label>배터리 <span id="socV"></span></label>
      <input id="soc" type="range" min="10" max="100" step="1" value="80">

      <label>탑승 인원 <span id="occV"></span></label>
      <input id="occ" type="range" min="1" max="5" step="1" value="1">

      <label>주행 모드</label>
      <div class="seg" id="mode"></div>

      <label>공조</label>
      <div class="seg" id="hvac"></div>

      <label>타이어 공기압</label>
      <div class="seg" id="tire"></div>

      <label>날씨</label>
      <div class="seg" id="wsrc"></div>
      <div id="manualWeather" hidden>
        <label>기온 <span id="tempV"></span></label>
        <input id="temp" type="range" min="-20" max="40" step="1" value="10">
        <div class="seg" id="weather" style="margin-top:8px"></div>
      </div>
      <p class="muted small" style="margin-top:18px">학습 전 기본값(차종 평균)으로 계산합니다. 실제 앱은 차량별 주행 기록으로 계속 학습합니다.</p>
    </section>

    <div class="right">
      <section class="card rec" id="rec"><span class="muted">계산 중…</span></section>
      <section class="card">
        <div class="muted small" id="cond"></div>
        <div id="map"></div>
      </section>
      <section class="card">
        <h3 style="margin:0 0 10px">후보 충전소 비교</h3>
        <div class="scroll"><table id="table"></table></div>
        <p class="muted small" id="attrib"></p>
      </section>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { recommend, TYPE_LABEL } from "./model.js";

const API = "https://asia-northeast3-h-y-server.cloudfunctions.net/api";
const ORIGIN = { name: "서울시청", lat: 37.5665, lng: 126.9780 };
// 거리·시간은 서버가 실제 도로 경로(OSRM)로 계산
const DESTS = [
  { name: "부산", lat: 35.1796, lng: 129.0756 },
  { name: "대구", lat: 35.8714, lng: 128.6014 },
  { name: "광주", lat: 35.1595, lng: 126.8526 },
  { name: "여수", lat: 34.7604, lng: 127.6622 },
  { name: "강릉", lat: 37.7519, lng: 128.8761 },
  { name: "대전", lat: 36.3504, lng: 127.3845 },
];

const api = {
  async routeChargers(origin, dest, departOffsetMin) {
    const r = await fetch(`${API}/route/chargers`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ origin, dest, departOffsetMin }) });
    if (!r.ok) throw new Error(`경로·충전소 조회 실패 ${r.status}`);
    return r.json();
  },
  async routeWeather(points) {
    const r = await fetch(`${API}/weather/route`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ points }) });
    if (!r.ok) throw new Error(`날씨 조회 실패 ${r.status}`);
    return (await r.json()).route;
  },
};

const $ = (id) => document.getElementById(id);
const state = { mode: "NORMAL", hvac: "on", tire: 250, wsrc: "forecast", weather: "CLEAR" };

function seg(id, items, key) {
  const el = $(id);
  el.innerHTML = items.map(([v, label]) => `<button data-v="${v}">${label}</button>`).join("");
  const sync = () => el.querySelectorAll("button").forEach((b) => b.classList.toggle("on", String(state[key]) === b.dataset.v));
  el.onclick = (e) => {
    const v = e.target.dataset?.v; if (v === undefined) return;
    state[key] = isNaN(+v) ? v : +v; sync(); onChange();
  };
  sync();
}

$("dest").innerHTML = DESTS.map((d, i) => `<option value="${i}">${d.name}</option>`).join("");
seg("mode", [["ECO", "에코"], ["NORMAL", "일반"], ["SPORT", "스포츠"]], "mode");
seg("hvac", [["on", "켜짐 22°C"], ["off", "꺼짐"]], "hvac");
seg("tire", [[250, "정상"], [225, "10% 부족"], [200, "20% 부족"]], "tire");
seg("wsrc", [["forecast", "실제 예보"], ["manual", "직접 입력"]], "wsrc");
seg("weather", [["CLEAR", "맑음"], ["RAIN", "비"], ["SNOW", "눈"]], "weather");

const fmtClock = (ms) => new Date(ms).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Seoul" });
const departMs = () => Date.now() + (+$("depart").value) * 3600000;

function labels() {
  const h = +$("depart").value;
  $("departV").textContent = h === 0 ? "지금" : `${h}시간 뒤 (${fmtClock(departMs())})`;
  $("socV").textContent = `${$("soc").value}%`;
  $("occV").textContent = `${$("occ").value}명`;
  $("tempV").textContent = `${$("temp").value}°C`;
  $("manualWeather").hidden = state.wsrc !== "manual";
}

// ---- 지도 ----
const map = L.map("map", { zoomControl: true });
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(map);
const layer = L.layerGroup().addTo(map);

function drawMap(dest, res) {
  layer.clearLayers();
  const line = L.polyline(res?.route?.path ?? [[ORIGIN.lat, ORIGIN.lng], [dest.lat, dest.lng]], { color: "#4f8cff", weight: 4 }).addTo(layer);
  L.circleMarker([ORIGIN.lat, ORIGIN.lng], { radius: 7, color: "#fff", fillColor: "#4f8cff", fillOpacity: 1 }).bindTooltip("출발 " + ORIGIN.name).addTo(layer);
  L.circleMarker([dest.lat, dest.lng], { radius: 7, color: "#fff", fillColor: "#e53935", fillOpacity: 1 }).bindTooltip("도착 " + dest.name).addTo(layer);
  const bestId = res?.options?.[0]?.station.id;
  for (const v of res?.candidates ?? []) {
    const color = v.id === bestId ? "#4caf50" : v.available > 0 ? "#9aa3b5" : "#ffb300";
    L.circleMarker([v.lat, v.lng], { radius: v.id === bestId ? 10 : 6, color, fillColor: color, fillOpacity: 0.85 })
      .bindTooltip(`${v.name}<br>${Math.round(v.atKm)}km 지점 · 빈 ${v.available}/${v.total - v.outOfService} · ${Math.round(v.maxKw)}kW`).addTo(layer);
  }
  map.fitBounds(line.getBounds(), { padding: [30, 30] });
}

// ---- 계산 ----
let seq = 0, timer = null;
function onChange() { labels(); clearTimeout(timer); timer = setTimeout(run, 300); }
for (const id of ["dest", "depart", "soc", "occ", "temp"]) $(id).addEventListener("input", onChange);

const waitColor = (m) => (m < 5 ? "var(--good)" : m < 15 ? "var(--warn)" : "var(--bad)");
const P = (x) => `${Math.round(x * 100)}%`;

async function run() {
  const my = ++seq;
  const dest = DESTS[+$("dest").value];
  const dep = departMs();
  $("rec").classList.add("loading");
  try {
    const res = await recommend(api, {
      origin: { lat: ORIGIN.lat, lng: ORIGIN.lng }, dest: { lat: dest.lat, lng: dest.lng }, departMs: dep,
      soc: +$("soc").value, occupants: +$("occ").value, mode: state.mode,
      hvacOn: state.hvac === "on", cabinSetC: 22, tireKpa: state.tire,
      useForecast: state.wsrc === "forecast", tempC: +$("temp").value, weather: state.weather,
    });
    if (my !== seq) return;
    render(dest, dep, res);
  } catch (e) {
    if (my !== seq) return;
    $("rec").innerHTML = `<span class="err">${e.message}</span>`;
  } finally {
    if (my === seq) $("rec").classList.remove("loading");
  }
}

function render(dest, dep, res) {
  const tot = res.plan.kind === "plan" ? [res.plan.minutesP50, res.plan.minutesP90] : res.plan.kind === "none" ? [res.direct.minutesP50, res.direct.minutesP90] : null;
  $("eta").innerHTML = tot ? `<b>도착 예정 ${fmtClock(dep + tot[0] * 60000)}</b><div class="muted small">늦어도 ${fmtClock(dep + tot[1] * 60000)} · 충전·대기 포함</div>` : "";

  const ctx = res.env.context, w = res.weather;
  $("cond").textContent = `${ORIGIN.name} → ${dest.name} · 도로 ${Math.round(res.route.distanceKm)}km · ${Math.round(res.route.durationMin)}분 · ${TYPE_LABEL[ctx.type]} · ${ctx.night ? "밤" : "낮"}${ctx.weekend ? " · 주말" : ""} · ` +
    `경로 기온 ${Math.round(w.tempC)}°C ${{ CLEAR: "맑음", RAIN: "비", SNOW: "눈" }[w.kind]}${w.forecast ? " (예보)" : " (직접 입력)"} · ` +
    `충전 없이 갈 확률 ${P(res.direct.probability)}, 도착 시 배터리 약 ${P(Math.max(res.direct.socP50, 0))}`;
  $("attrib").textContent = `경로상 충전소 ${res.checked}곳 확인 · 충전소: 한국환경공단 실시간 데이터(H-Y Server 수집) · 경로: © OpenStreetMap contributors, OSRM` + (w.forecast ? " · Weather data by Open-Meteo.com" : "");

  const rec = $("rec");
  if (res.plan.kind === "none") {
    rec.innerHTML = `<div class="name" style="color:var(--good)">충전 없이 도착할 수 있어요</div><div>도착 확률 ${P(res.plan.probability)}</div>`;
  } else if (res.plan.kind === "infeasible") {
    rec.innerHTML = `<div class="name" style="color:var(--bad)">한 번 충전으로는 안전하게 가기 어려워요</div><div class="muted">확인한 충전소 ${res.checked}곳 · 배터리를 더 채우고 출발하세요</div>`;
  } else {
    const best = res.options[0], s = best.station, p = res.plan;
    const saved = res.savedMin != null ? Math.round(res.savedMin) : null;
    const badge = saved && saved > 0
      ? `<span class="badge" style="background:rgba(76,175,80,.15);color:var(--good)">출력이 가장 큰 ${res.baseline.station.name}보다 ${saved}분 빨라요</span>`
      : `<span class="badge" style="background:rgba(79,140,255,.15);color:var(--accent)">출력이 가장 큰 충전소가 지금 가장 빨라요</span>`;
    rec.innerHTML = `
      <div class="muted small">추천 충전소 · 출발 후 약 ${Math.round(best.atKm)}km${s.restArea ? " · 고속도로 휴게소" : ` · 경로에서 ${s.offRouteKm}km`}</div>
      <div class="name">${s.name}</div>
      <div class="wait">도착 시 대기 <b style="color:${waitColor(best.waitMin)}">약 ${Math.round(best.waitMin)}분</b></div>
      <div>지금 빈 충전기 ${s.available}/${s.total - s.outOfService} · 최대 ${Math.round(s.maxKw)}kW · ${P(p.chargeToSoc)}까지 충전 (약 ${Math.round(p.chargeMinutesP50)}분)</div>
      ${badge}
      <div class="muted">총 소요 약 ${Math.round(p.minutesP50)}분 (늦어지면 ${Math.round(p.minutesP90)}분) · 도착 확률 ${P(p.probability)}</div>`;
  }

  const rows = res.options.map((o, i) => {
    const s = o.station;
    const tags = (s.restArea ? `<span class="tag" style="background:rgba(154,163,181,.2);color:var(--muted)">휴게소</span>` : "") + (i === 0 ? `<span class="tag" style="background:rgba(76,175,80,.2);color:var(--good)">추천</span>` : "") +
      (o === res.baseline ? `<span class="tag" style="background:rgba(79,140,255,.2);color:var(--accent)">최대 출력</span>` : "");
    return `<tr><td>${s.name}${tags}</td><td>${Math.round(o.atKm)}km</td><td style="color:${waitColor(o.waitMin)}">${Math.round(o.waitMin)}분</td>` +
      `<td>${Math.round(o.plan.chargeMinutesP50)}분 → ${P(o.plan.chargeToSoc)}</td><td>${Math.round(o.plan.minutesP50)}분</td><td>${s.available}/${s.total - s.outOfService}</td><td>${Math.round(s.maxKw)}kW</td></tr>`;
  }).join("");
  $("table").innerHTML = `<tr><th>충전소</th><th>위치</th><th>도착 시 대기</th><th>충전</th><th>총 소요</th><th>지금 빈자리</th><th>출력</th></tr>` +
    (rows || `<tr><td colspan="7" class="muted">${res.plan.kind === "none" ? "충전이 필요 없습니다" : "목표 확률(95%)을 만족하는 충전소가 없습니다"}</td></tr>`);

  drawMap(dest, res);
}

labels();
run();
</script>
</body>
</html>
